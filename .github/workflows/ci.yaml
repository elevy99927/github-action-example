name: ci

on:
  push:
    branches:
      - semgrep
  workflow_dispatch:

jobs:
  # docker-build and semgrep-scan run in parallel
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker build
        run: docker build -t app:${{ github.sha }} .

  semgrep-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ponytail: same steps as iosifache/semgrep-rules-manager@v0.4.0, which still uses deprecated checkout@v3 and codeql-action@v2
      - name: Semgrep scan
        run: |
          pip install semgrep semgrep-rules-manager
          mkdir -p /tmp/rules
          semgrep-rules-manager --dir /tmp/rules download
          semgrep ci --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: /tmp/rules

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  build:
    needs: [docker-build, semgrep-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Push to Docker Hub (mock)
        run: echo "push to dockerhub"

  gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Commit to GitOps repo (mock)
        run: echo "commit to gitops repo"
